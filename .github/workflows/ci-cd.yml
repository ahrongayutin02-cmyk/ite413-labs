name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continuous-integration:
    name: Continuous Integration
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run automated tests
        run: npm run test:ci

      - name: Build application
        run: npm run build

  continuous-deployment:
    name: Continuous Deployment
    needs: continuous-integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Verify Docker is accessible
        run: docker info

      - name: Build Ionic image
        run: docker build -t ionic-crud .

      - name: Remove previous container
        run: docker rm -f ionic-crud ionic-crud-container
        continue-on-error: true

      - name: Start updated container
        run: docker run -d --name ionic-crud-container --restart unless-stopped -p 8100:8100 ionic-crud

      - name: Verify app
        shell: powershell
        run: |
          $healthy = $false
          for ($i = 1; $i -le 60; $i++) {
            $status = docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' ionic-crud-container 2>$null
            if ($status -eq 'healthy') {
              $healthy = $true
              break
            }
            Write-Host "waiting for container health ($i/60): $status"
            Start-Sleep -Seconds 5
          }
          if (-not $healthy) {
            docker ps -a
            docker logs ionic-crud-container
            exit 1
          }
          $response = Invoke-WebRequest -Uri http://localhost:8100/ -UseBasicParsing -TimeoutSec 10
          Write-Host "HTTP $($response.StatusCode) - deployment verified"
